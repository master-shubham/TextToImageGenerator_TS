<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Linking Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>texttoimagegenerator</title>
  </head>
  <body class="dark-theme">
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo-wrapper">
          <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
          </div>
          <h1>AI IMAGE GENERATOR</h1>
        </div>
        <button class="theme-toggle">
          <i class="fa-solid fa-moon"></i>
        </button>
      </header>

      <!-- Main -->
      <div class="main-content">
          <form action="#" class="prompt-form">
        <!-- Prompt Container -->
        <div class="prompt-container">
          <textarea
            class="prompt-input"
            placeholder="Describe your imagination in detail..."
            required
            autofocus
          ></textarea>
          <button type="button" class="prompt-btn">
            <i class="fa-solid fa-dice"></i>
          </button>
        </div>

        <div class="prompt-actions">
          <div class="select-wrapper">
            <select class="custom-select" required>
              <option value="" selected disabled>Select Model</option>
              <option value="black-forest-labs/FLUX.1-dev">FLUX.1-dev</option>
              <option value="black-forest-labs/FLUX.1-schnell">
                FLUX.1-schnell
              </option>
              <option value="stabilityai/stable-diffusion-xl-base-1.0">
                Stable Diffusion XL
              </option>
              <option value="runwayml/stable-diffusion-v1-5">
                Stable Diffusion v1.5
              </option>
              <option value="prompthero/openjourney">Openjourney</option>
            </select>
          </div>
          <div class="select-wrapper">
            <select class="custom-select" required>
              <option value="" selected disabled>Image Count</option>
              <option value="1">1 Image</option>
              <option value="2">2 Images</option>
              <option value="3">3 Images</option>
              <option value="4">4 Images</option>
            </select>
          </div>
          <div class="select-wrapper">
            <select class="custom-select" required>
              <option value="" selected disabled>Aspect Ration</option>
              <option value="1/1">Square (1:1)</option>
              <option value="16/9">LandScape (1:1)</option>
              <option value="9/16">Portrait (1:1)</option>
            </select>
          </div>

          <button type="submit" class="generate-btn">
            <i class="fa-solid fa-wand-sparkles"></i>
            Generate
          </button>
        </div>

        <div class="gallery-grid">
          <div class="img-card loading">
            <div class="status-container">
              <div class="spinner"></div>
              <i class="fa-solid fa-triangle-exclamation"></i>
              <p class="status-text">Generating...</p>
            </div>
            <img src="" alt="" class="result-img">
            <div class="img-overlay">
              <button class="img-download-btn">
                <i class="fa-solid fa-download"></i>
              </button>
            </div>
          </div>
          <div class="img-card">
            <img src="" alt="" class="result-img">
            <div class="img-overlay">
              <button class="img-download-btn">
                <i class="fa-solid fa-download"></i>
              </button>
            </div>
          </div>
          <div class="img-card">
            <img src="" alt="" class="result-img">
            <div class="img-overlay">
              <button class="img-download-btn">
                <i class="fa-solid fa-download"></i>
              </button>
            </div>
          </div>
          <div class="img-card">
            <img src="" alt="" class="result-img">
            <div class="img-overlay">
              <button class="img-download-btn">
                <i class="fa-solid fa-download"></i>
              </button>
            </div>
          </div>
        </div>
      </form>
      </div>
      
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
